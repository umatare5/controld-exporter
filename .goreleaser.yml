# .goreleaser.yml for controld-exporter

project_name: controld-exporter
version: 2

# Distribution directory
dist: tmp/dist

# Build destination
github_urls:
  skip_tls_verify: false

before:
  hooks:
    - go mod tidy
    - go mod verify

builds:
  - main: ./cmd
    id: controld-exporter
    binary: controld-exporter
    flags:
      - -trimpath
    targets:
      - linux_amd64
      - linux_arm64
      - darwin_amd64
      - darwin_arm64
      - windows_amd64
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X 'github.com/umatare5/controld-exporter/internal/cli.version={{ .Version }}'
    hooks:
      post:
        # The setting is recorded in the binary, so this fails the release if cgo returns
        - cmd: grep -q CGO_ENABLED=0 {{ .Path }}

archives:
  - name_template: "{{ .ProjectName }}-v{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"
    files:
      - "README.md"
      - "CHANGELOG.md"
      - "examples/*.yml"
      - "LICENSE"
      - "NOTICE"
      - "SECURITY.md"
    format_overrides:
      - goos: windows
        formats: ["zip"]

# Docker configuration
dockers_v2:
  - images:
      - ghcr.io/umatare5/controld-exporter
    tags:
      - latest
      - "{{ .Tag }}"
      - "v{{ .Major }}.{{ .Minor }}"
    platforms:
      - linux/amd64
      - linux/arm64
    ids:
      - controld-exporter
    # A prerelease must not move latest or the version tags. buildx builds and
    # pushes in one step, so the whole configuration is disabled instead of
    # skipping the push; snapshot builds stay enabled for local verification.
    disable: '{{ and (not .IsSnapshot) (ne .Prerelease "") }}'
    labels:
      "org.opencontainers.image.title": "{{ .ProjectName }}"
      "org.opencontainers.image.description": "Prometheus Exporter for Control D"
      "org.opencontainers.image.url": "https://github.com/umatare5/controld-exporter"
      "org.opencontainers.image.source": "https://github.com/umatare5/controld-exporter"
      "org.opencontainers.image.version": "{{ .Version }}"
      "org.opencontainers.image.created": "{{ .Date }}"
      "org.opencontainers.image.revision": "{{ .FullCommit }}"
      "org.opencontainers.image.licenses": "MIT"
    extra_files:
      - "LICENSE"
      - "NOTICE"

release:
  prerelease: auto
  draft: true
  replace_existing_draft: true
  header: |
    ## {{ .ProjectName }} v{{ .Version }}

    This release contains the Prometheus Exporter for Control D.

    > [!IMPORTANT]
    > Read the [CHANGELOG](https://github.com/umatare5/controld-exporter/blob/{{ .Tag }}/CHANGELOG.md) before upgrading.

    ### 🐳 Container Images

    ```bash
    # Latest version
    docker run --rm ghcr.io/umatare5/controld-exporter:latest --help

    # Specific version
    docker run --rm ghcr.io/umatare5/controld-exporter:{{ .Tag }} --help

    # With environment variables
    docker run --rm -p 10034:10034 -e CTRLD_API_KEY ghcr.io/umatare5/controld-exporter:{{ .Tag }}
    ```

    ### 📦 Binary Installation

    Download a prebuilt binary for your platform from the release assets below.

  footer: |
    **Full Changelog**: https://github.com/umatare5/controld-exporter/compare/{{ .PreviousTag }}...{{ .Tag }}

    ### 📚 Documentation

    - [README](https://github.com/umatare5/controld-exporter/blob/{{ .Tag }}/README.md)
    - [CHANGELOG](https://github.com/umatare5/controld-exporter/blob/{{ .Tag }}/CHANGELOG.md)
    - [Container Registry](https://github.com/umatare5/controld-exporter/pkgs/container/controld-exporter)

# Generate checksums for source archives
checksum:
  name_template: "{{ .ProjectName }}-v{{ .Version }}_checksums.txt"

# Changelog configuration
changelog:
  use: github
  sort: asc
  abbrev: 0
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug Fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Documentation Updates
      regexp: '^.*?docs(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: Others
      order: 999
  filters:
    exclude:
      - "^Merge branch "
      - "^release:"
      - "^ci:"
      - "^test:"

# Metadata for Go proxy and pkg.go.dev
metadata:
  mod_timestamp: "{{ .CommitTimestamp }}"
