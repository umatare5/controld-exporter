name: Notify Workflow Failure

on:
  workflow_run:
    workflows:
      [
        "CodeQL Analysis",
        "Coverage",
        "Test and Build",
        "govulncheck",
        "Release Snapshot",
      ]
    types: ["completed"]

permissions:
  contents: read

jobs:
  notify:
    if: github.event.workflow_run.event == 'schedule' && github.event.workflow_run.conclusion == 'failure'
    permissions:
      issues: write
    uses: umatare5/common/.github/workflows/notify-workflow-failure.yml@2dc181f4ceb6cd36a063f968d42c22953b554efd # v0.22.0
    with:
      workflow_name: ${{ github.event.workflow_run.name }}
      run_url: ${{ github.event.workflow_run.html_url }}
