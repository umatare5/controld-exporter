name: Release Application

on:
  push:
    branches: ["main"]
    paths: ["VERSION"]

permissions:
  contents: write
  packages: write

jobs:
  tagging:
    uses: umatare5/common/.github/workflows/tagging.yml@2dc181f4ceb6cd36a063f968d42c22953b554efd # v0.22.0

  release:
    needs: tagging
    uses: umatare5/common/.github/workflows/go-release.yml@2dc181f4ceb6cd36a063f968d42c22953b554efd # v0.22.0
    with:
      go_version: "1.27.1"
      goreleaser_version: "v2.18.1"
