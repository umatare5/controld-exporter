name: Release Application

on:
  push:
    branches: ["main"]
    paths: ["VERSION"]

permissions:
  contents: write
  packages: write

jobs:
  tagging:
    uses: umatare5/common/.github/workflows/tagging.yml@8044b3c0ce0dce6411ec179c3ec0e675219c117f # v0.21.0

  release:
    needs: tagging
    uses: umatare5/common/.github/workflows/go-release.yml@8044b3c0ce0dce6411ec179c3ec0e675219c117f # v0.21.0
    with:
      go_version: "1.27.0"
      goreleaser_version: "v2.18.0"
