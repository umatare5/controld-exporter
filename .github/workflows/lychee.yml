name: Link Check

on:
  push:
    paths:
      - "**/*.md"
      - "lychee.toml"
      - ".github/workflows/lychee.yml"
  pull_request:
    paths:
      - "**/*.md"
      - "lychee.toml"
      - ".github/workflows/lychee.yml"

permissions:
  contents: read

jobs:
  lychee:
    uses: umatare5/common/.github/workflows/lychee.yml@2dc181f4ceb6cd36a063f968d42c22953b554efd # v0.22.0
    with:
      lychee_version: "v0.24.2"
