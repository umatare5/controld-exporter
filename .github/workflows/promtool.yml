name: Prometheus Rules

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  promtool:
    uses: umatare5/common/.github/workflows/promtool.yml@2dc181f4ceb6cd36a063f968d42c22953b554efd # v0.22.0
    with:
      promtool_version: "3.15.0"
      rule_files: |
        examples/prometheus_alert_rules.yml
      test_files: |
        examples/prometheus_alert_rules_test.yml
      config_files: |
        examples/prometheus.yml
      lint: "all"
