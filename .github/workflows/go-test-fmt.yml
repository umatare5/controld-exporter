name: Format and Lint

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  fmt:
    uses: umatare5/common/.github/workflows/go-test-fmt.yml@2dc181f4ceb6cd36a063f968d42c22953b554efd # v0.22.0
    with:
      go_version: "1.27.1"
      golangci_lint_version: "v2.14.0"
      golangci_lint_config: ".golangci.yml"
