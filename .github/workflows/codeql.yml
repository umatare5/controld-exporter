name: CodeQL Analysis

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    # Run weekly on Sundays at 12:00 UTC
    - cron: "0 12 * * 0"

permissions:
  security-events: write
  packages: read

jobs:
  codeql:
    uses: umatare5/common/.github/workflows/codeql.yml@8044b3c0ce0dce6411ec179c3ec0e675219c117f # v0.21.0
