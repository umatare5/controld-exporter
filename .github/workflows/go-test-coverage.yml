name: Coverage
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 2 * * 1" # every Monday at 2:00

permissions:
  contents: read

jobs:
  coverage:
    uses: umatare5/common/.github/workflows/go-test-coverage.yml@3df623d482350006c12656381399db14f8879fcc # v0.19.0
    with:
      go_version: "1.27.0"
      coverage_threshold: 0 # No unit tests yet; tighten after tests are added.
