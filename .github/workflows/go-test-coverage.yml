name: Coverage
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 2 * * 1" # every Monday at 2:00

permissions:
  contents: read

jobs:
  coverage:
    uses: umatare5/common/.github/workflows/go-test-coverage.yml@8044b3c0ce0dce6411ec179c3ec0e675219c117f # v0.21.0
    with:
      go_version: "1.27.1"
      coverage_threshold: 0 # No unit tests yet; tighten after tests are added.
