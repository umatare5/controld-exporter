name: Test and Build
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 2 * * 1" # every Monday at 2:00

permissions:
  contents: read

jobs:
  build:
    uses: umatare5/common/.github/workflows/go-test-build.yml@3df623d482350006c12656381399db14f8879fcc # v0.19.0
    with:
      go_version: "1.27.0"
